<!doctype html>
<html lang="es">
<head>

<title>PosterKit</title>
<style>
  :root{--bg:#24073a;--ink:#fff;--acc:#ff2e88}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:var(--bg);color:var(--ink);padding:24px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .c{max-width:420px;text-align:center}
  h1{font-size:34px;letter-spacing:-.03em;margin:0 0 8px}
  h1 span{color:var(--acc)}
  p{opacity:.8;margin:0 0 24px}
  a{display:inline-block;color:var(--bg);background:var(--ink);
    text-decoration:none;font-weight:600;padding:14px 24px;border-radius:28px}
</style>
</head>
<body>
  <div class="c">
    <h1>PosterKit<span>.</span></h1>
    <p>Convierte cualquier imagen en un póster grande, impreso hoja por hoja.</p>

  </div>
